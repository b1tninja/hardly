name: Release

# Tag vX.Y.Z -> build once, attest, publish to PyPI (trusted publishing), GitHub Release,
# GHCR image and the MCP Registry. Pre-release versions (a/b/rc/dev) go to TestPyPI only.
# workflow_dispatch -> build + publish to TestPyPI (dry run of the pipeline).
# One-time owner setup: docs/releasing.md. Third-party actions use major tags (see ci.yml note).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check version consistency
        id: meta
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json, os, re, tomllib
          v = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          init = re.search(r'__version__ = "([^"]+)"', open("src/hardly/__init__.py").read()).group(1)
          srv = json.load(open("server.json"))
          assert init == v, f"__version__ {init} != pyproject {v}"
          assert srv["version"] == v and srv["packages"][0]["version"] == v, "server.json version mismatch"
          if os.environ["REF_TYPE"] == "tag":
              assert os.environ["REF_NAME"] == f"v{v}", f"tag {os.environ['REF_NAME']} != v{v}"
          pre = bool(re.search(r"(a|b|rc|dev)\d*$", v))
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"version={v}\nprerelease={'true' if pre else 'false'}\n")
          PY
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - run: python scripts/check_dist.py dist
      - name: Clean-venv smoke test and SBOM
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install dist/*.whl cyclonedx-bom
          (cd "$RUNNER_TEMP" && venv/bin/hardly --help > /dev/null && venv/bin/hardly skill print | head -n 3)
          "$RUNNER_TEMP/venv/bin/cyclonedx-py" environment "$RUNNER_TEMP/venv" --of JSON -o sbom.cdx.json
      - name: Checksums
        run: |
          (cd dist && sha256sum -- * > SHA256SUMS)
          cat dist/SHA256SUMS
      - name: Release notes
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: python scripts/release_notes.py "$VERSION" > release-notes.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-files
          path: |
            dist/
            sbom.cdx.json
            release-notes.md
          if-no-files-found: error

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch' || needs.build.outputs.prerelease == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/p/hardly
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-files
      - name: Keep only distributions
        run: rm -f dist/SHA256SUMS
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    if: github.ref_type == 'tag' && needs.build.outputs.prerelease == 'false'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/hardly
    permissions:
      id-token: write       # PyPI trusted publishing + Sigstore attestations
      attestations: write   # GitHub build provenance / SBOM attestations
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-files
      # Attest the exact files that get uploaded below (no rebuild), before any upload.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.whl
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/*.whl
          sbom-path: sbom.cdx.json
      - name: Keep only distributions for PyPI
        run: rm -f dist/SHA256SUMS
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true   # PEP 740 attestations (default; explicit on purpose)

  github-release:
    needs: [build, publish-pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-files
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* sbom.cdx.json \
            --title "$TAG" --notes-file release-notes.md --verify-tag

  publish-image:
    needs: [build, publish-pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/b1tninja/hardly
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/b1tninja/hardly
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  publish-mcp:
    needs: [build, publish-pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write   # GitHub OIDC login to the MCP Registry
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Wait for the version to appear on PyPI
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS "https://pypi.org/pypi/hardly/$VERSION/json" > /dev/null; then exit 0; fi
            sleep 20
          done
          echo "hardly $VERSION not visible on PyPI" >&2; exit 1
      - name: Install mcp-publisher (pinned, checksum-verified)
        env:
          # Bump together: version, then `sha256sum mcp-publisher_linux_amd64.tar.gz` and compare with
          # the release's registry_<version>_checksums.txt before changing the hash.
          MCP_PUBLISHER_VERSION: v1.8.1
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum --check --strict -
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
