[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hardly"
version = "0.2.18"
description = "HAR analysis MCP server — index, query, document, and probe APIs without burning tokens on raw captures"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0",
    "httpx>=0.27",
    "ijson>=3.2",
]

[project.scripts]
hardly = "hardly.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
capture = [
    # 1.49+: locator.aria_snapshot; 1.59+: mode="ai" (refs for agents)
    "playwright>=1.49",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hardly"]

[tool.pytest.ini_options]
testpaths = ["tests"]
